name: PulseMonitor
options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SA7RK66C85
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  PulseMonitor:
    type: application
    platform: macOS
    sources:
      - path: PulseMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.monitor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: false
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_AppGroupIdentifier: "$(TeamIdentifierPrefix)group.app.pulse"
    entitlements:
      path: PulseMonitor/PulseMonitor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.app.pulse
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    dependencies:
      - target: PulseWidgets
        embed: true                               # crea la fase Embed Foundation Extensions

  PulseWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: PulseWidgets
      - path: PulseMonitor/Core/Models
      - path: PulseMonitor/Core/Storage
      - path: PulseMonitor/Core/Utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.monitor.PulseWidgets
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSExtension_POINTIDENTIFIER: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundleDisplayName: "Pulse Monitor"
        INFOPLIST_KEY_AppGroupIdentifier: "$(TeamIdentifierPrefix)group.app.pulse"
    entitlements:
      path: PulseWidgets/PulseWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true      # el widget SÍ sandboxeado
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.app.pulse
